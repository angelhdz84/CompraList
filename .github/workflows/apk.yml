name: Build APK

# Empaqueta la web estatica en un APK de Android con Capacitor SIN tocar el
# repositorio: ni package.json, ni capacitor.config.json, ni una carpeta
# android/ versionada. Todo ocurre dentro del runner y lo unico que sale de aqui
# es el .apk.
#
# - La app web sigue siendo index.html + css/style.css + js/app.js, sin build.
#   Node sigue siendo solo tooling, igual que tests/ y tools/.
# - Se copia a un directorio de escenario (www/) SOLO lo que la app necesita en
#   tiempo de ejecucion. Si se usara el repo entero como webDir, el APK se
#   llevaria node_modules, tests/ y tools/ dentro.
# - Se firma con un keystore fijo guardado en Secrets. Importante: NO se usa el
#   keystore debug de Gradle porque se regenera en cada runner, de modo que dos
#   builds distintos tendrian firmas distintas y el segundo APK no podria
#   actualizar al primero instalado (habria que desinstalar y perder los datos).
#
# Nota sobre la plantilla: la de Capacitor 7 NO trae bloque signingConfigs, asi
# que hay que añadirlo al final. No se parchea el texto de la plantilla porque
# cambiaria entre versiones; se le AÑADE un bloque android { } nuevo, que el DSL
# de Groovy fusiona con el existente.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_VERSION: '7.4.3'
  APP_ID: 'com.compralist.app'
  APP_NAME: 'CompraLIST'

jobs:
  apk:
    name: Compilar APK firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # JDK 21, no 17: el módulo capacitor-android declara
      # sourceCompatibility/targetCompatibility = VERSION_21 y con 17 el build
      # muere en :capacitor-android:compileReleaseJavaWithJavac con
      # "error: invalid source release: 21".
      # v6 y no v4: GitHub marca v4 como deprecada ("no longer receive updates").
      # La clave `java-version` no ha cambiado entre las versiones, asi que el
      # bloque es identico salvo el major.
      # OJO: hay DOS avisos distintos y se encadenan. Primero "setup-java v4 is
      # deprecated"; al subirlo aparece "Node.js 20 is deprecated ... actions
      # pointing to Node 20 are being forced to run on Node.js 24". Ese segundo
      # es de las CINCO actions del workflow, no solo de esta. Los majors actuales
      # (checkout v7, setup-java v6, setup-node v7, setup-android v4,
      # upload-artifact v7) ya usan node24, asi que subir solo una deja el aviso
      # a medias y no se ve si el problema era de esa o de las otras.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # El runner no trae el SDK de Android: hay que instalarlo o Gradle falla.
      # OJO: el valor por defecto de esta action es `tools platform-tools`, y el
      # paquete "tools" ya no existe en los cmdline-tools actuales (16.0); falla
      # con "Warning: Failed to find package 'tools'" y tumba todo el build. Se
      # pasan solo los paquetes que existen hoy.
      # Comprobado en el action.yml de v4: `packages` SIGUE con
      # default: 'platform-tools', o sea que la trampa de arriba no se ha
      # resuelto sola al subir de major. Hay que seguir pasandolo explicito.
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Aceptar licencias de Android
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true

      # Solo lo que la app usa en ejecucion. Sin esto el APK arrastraria
      # node_modules y los ficheros de test.
      - name: Preparar los ficheros web de la app
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r css js assets www/
          echo "--- contenido de www/ ---"
          find www -type f | sort
          echo "--- peso ---"
          du -sh www

      - name: Generar proyecto Android con Capacitor
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock \
            "@capacitor/core@$CAPACITOR_VERSION" \
            "@capacitor/android@$CAPACITOR_VERSION"
          # OJO: `cap init` no tiene --no-interactive (en 7.4.3 solo acepta
          # --web-dir y --skip-appid-validation). No hace falta: si se pasan
          # appName y appId y la terminal no es interactiva, el propio comando
          # usa --web-dir sin preguntar nada.
          npx --yes "@capacitor/cli@$CAPACITOR_VERSION" init \
            "$APP_NAME" "$APP_ID" --web-dir www
          npx --yes "@capacitor/cli@$CAPACITOR_VERSION" add android
          npx --yes "@capacitor/cli@$CAPACITOR_VERSION" sync android

      - name: Iconos del launcher
        run: |
          set -euo pipefail
          # OJO: cambiar assets/icon.svg NO cambia lo que se ve en la pantalla de
          # inicio del movil. Los iconos del launcher son los res/mipmap-*, que
          # vienen de la plantilla de Capacitor con el icono POR DEFECTO. Hay que
          # sobrescribirlos aqui.
          #
          # Los PNG se generan con el mismo rasterizador que los de la web
          # (tools/make-icons.mjs), en forma "launcher": fondo a sangre y simbolo
          # al 66%, porque el launcher aplica su propia mascara encima. Si se
          # pusiera el fondo redondeado se veria doble redondeo.
          node tools/make-icons.mjs --launcher android/app/src/main/res

          # Y el icono adaptativo de Android (API 26+), que es un vectorial mas un
          # color de fondo en lugar de un raster. Sin esto, el launcher aplica su
          # mascara al PNG y el icono queda encogido dentro de un borde.
          #
          # OJO: hay que BORRAR los iconos de la plantilla ANTES de copiar. No solo
          # porque compitan: la plantilla trae drawable-v24/ic_launcher_foreground.xml,
          # y una carpeta con sufijo de version tiene PRIORIDAD sobre drawable/ en
          # API 24+. Sin borrarla, el fondo seria el nuestro pero el simbolo seria
          # el logo de Capacitor, y eso no se ve hasta que lo instalas en el movil.
          #
          # Los ficheros viven en tools/android-icons/ y no en assets/ a proposito:
          # assets/ se copia entero a www/ para el escenario web, y tres XML que la
          # web no usa no tienen por que acabar en el APK.
          find android/app/src/main/res -name 'ic_launcher*' -delete
          cp tools/android-icons/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp tools/android-icons/ic_launcher_background.xml android/app/src/main/res/values/
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp tools/android-icons/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp tools/android-icons/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "--- iconos del launcher ---"
          find android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Fijar el id de aplicacion
        run: |
          set -euo pipefail
          # La plantilla trae com.getcapacitor.*; se fuerza el nuestro. sed es
          # idempotente, asi que da igual que cap ya lo haya cambiado.
          sed -i "s/applicationId \".*\"/applicationId \"$APP_ID\"/" android/app/build.gradle
          sed -i "s/namespace \".*\"/namespace \"$APP_ID\"/" android/app/build.gradle
          grep -E 'applicationId|namespace' android/app/build.gradle

      - name: Firmar con el keystore de Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/compralist.keystore

          # Falla aqui, con un mensaje claro, si la clave no cuadra; y no tres
          # minutos despues dentro de Gradle con un error dificil de leer.
          keytool -list -keystore android/compralist.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # keyPassword = storePassword a proposito. keytool avisa al crear un
          # PKCS12 de que no admite contrasenas separadas para store y clave
          # ("Ignoring user-specified -keypass option and using storepass
          # instead"), asi que la clave privada va cifrada con el store password.
          # Poner ahi KEY_PASSWORD hacia fallar el empaquetado con
          # "Get Key failed: Given final block not properly padded".
          #
          # Comprobacion previa: leer la clave de verdad (no solo listar) para que
          # un problema de contrasena salte en segundos y no despues de un build
          # entero. Ojo: keytool exige contrasenas de 6 caracteres o mas, asi que
          # el password de sondeo no puede ser corto. Con 2>&1 dentro del if para
          # que el error de keytool se vea en el log en vez de perderse.
          if ! keytool -importkeystore \
                -srckeystore android/compralist.keystore \
                -srcstorepass "$KEYSTORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" \
                -destkeystore /tmp/probe.p12 \
                -deststoretype PKCS12 \
                -deststorepass "probeprobe" \
                -destkeypass "probeprobe" 2>&1; then
            echo "::error::No se pudo leer la clave privada del keystore con el store password."
            echo "::error::Comprueba KEYSTORE_PASSWORD y KEY_ALIAS en los secrets del repo."
            exit 1
          fi
          rm -f /tmp/probe.p12
          echo "clave privada legible con el store password"

          cat > android/keystore.properties <<PROPS
          storeFile=compralist.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

          # Bloque AÑADIDO al final: la plantilla de Capacitor 7 no define
          # signingConfigs, asi que se le agrega. El DSL de Groovy fusiona varios
          # bloques android { } del mismo fichero.
          cat >> android/app/build.gradle <<'GRADLE'

          // ---- añadido por .github/workflows/apk.yml ----
          // El keystore NO se versiona: android/ esta en .gitignore y la clave
          // vive cifrada en el secret KEYSTORE_BASE64.
          android {
              signingConfigs {
                  release {
                      def propsFile = rootProject.file('keystore.properties')
                      if (!propsFile.exists()) {
                          throw new GradleException(
                              'Falta android/keystore.properties. Sin el, el APK saldria SIN FIRMAR ' +
                              'y Android lo rechazaria al instalar.')
                      }
                      def props = new Properties()
                      props.load(new FileInputStream(propsFile))
                      storeFile rootProject.file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "--- bloque de firma añadido ---"
          tail -n 30 android/app/build.gradle

      - name: Compilar APK release
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verificar que el APK sale firmado
        run: |
          set -euo pipefail
          # OJO: el APK sale en app/build/... (modulo :app), no en
          # android/build/... . Es android/ la raiz de Gradle y app/ el modulo.
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No se encontro ningun APK en android/app/build/outputs/apk/release"
            echo "--- APKs que si hay ---"
            find android -path '*outputs*' -name '*.apk' 2>/dev/null || echo "(ninguno)"
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No se encontro apksigner; no se puede comprobar la firma"
            exit 1
          fi
          echo "--- verificacion de firma ---"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK firmado correctamente"

      - uses: actions/upload-artifact@v7
        with:
          name: compralist-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumen
        run: |
          echo "### APK listo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Descárgalo del artefacto **compralist-apk** de esta run." >> "$GITHUB_STEP_SUMMARY"
          echo "Pásalo al móvil y ábrelo. Android pedirá permitir origenes desconocidos una vez." >> "$GITHUB_STEP_SUMMARY"
