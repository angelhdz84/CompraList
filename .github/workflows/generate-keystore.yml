name: Generar keystore (TEMPORAL)

# Workflow de un solo uso: crea el keystore de firma con las contraseñas que ya
# están en GitHub Secrets (nunca en el repositorio) y lo deja como artefacto
# para descargarlo. Después hay que BORRAR este fichero: el keystore no se
# versiona, se guarda cifrado en el secret KEYSTORE_BASE64.
#
# Se usa `retention-days: 1` porque el repositorio es público y los artefactos de
# un repo público se pueden descargar sin autenticar: la ventana de exposición es
# mínima y, aun así, el .keystore va cifrado con su contraseña.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Crear keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore compralist.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CompraLIST Pro, OU=Angel Hdz Aguilera, O=CompraLIST, L=, ST=, C=ES"
          echo "--- keystore creado ---"
          keytool -list -keystore compralist.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Comprobar que el alias existe
        run: |
          keytool -list -keystore compralist.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: compralist-keystore
          path: compralist.keystore
          retention-days: 1
          if-no-files-found: error

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
